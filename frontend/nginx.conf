# Sert le build Vite (SPA React Router) — aucun proxy `/api` ici : Traefik
# route `/api/*` directement vers le service `api`, ce conteneur ne voit jamais
# ce trafic (docker/docker-compose.traefik.yml).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fichiers immuables (noms de build hachés par Vite) : cache long côté
    # navigateur. `index.html` seul doit rester toujours revalidé (sinon un
    # déploiement suivant resterait invisible derrière un cache navigateur).
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
