# Configuration Alembic de RAGEngine.
#
# `sqlalchemy.url` est volontairement ABSENT : l'URL est résolue par `env.py`
# depuis `app.core.config.Settings`, c'est-à-dire depuis l'environnement. Aucun
# DSN ni mot de passe ne doit apparaître dans ce fichier versionné.

[alembic]
script_location = %(here)s/app/db/migrations
prepend_sys_path = %(here)s
path_separator = os

# Horodatage en tête des fichiers : l'ordre chronologique des migrations reste
# lisible sans ouvrir chaque révision.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

# Pas de `post_write_hooks` : le binaire `ruff` n'expose pas d'entrypoint
# `console_scripts` et un chemin absolu vers un venv ne survivrait pas au
# conteneur. Les révisions générées se formatent avec le reste du code
# (`ruff format .`), vérifié par la CI comme n'importe quel fichier.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
